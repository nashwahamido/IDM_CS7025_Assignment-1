<!DOCTYPE html>
<html lang="en">
       <head> 
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <link rel="stylesheet" type="text/css" href="stylesheet.css">
          <title>Cinematics and Motion</title>
       </head>
       <body>
       <!--Main Navigation Bar-->
       <header> 
         <nav id="navbar" aria-label="primary"> 
               <a href="homepage.html" class="navbutton">Home</a>
               <a href="about.html" class="navbutton">About</a>
               <a href="portfolio.html" class="navbutton active">Portfolio</a> <!-- Active class added to stay highlighted-->
               <a href="contact.html" class="navbutton">Contact</a>
            <p class="logo">NASHWA HAMIDO</p>
         </nav>
       </header>
       
       <!--3D Carousel Container for Cinematics and Motion Videos--> 
       <div id="carousel-3d-container">
           <div id="carousel-3d">
               <!-- Carousel Items with Videos -->
               <div class="carousel-3d-item active">
                   <video loop autoplay muted poster="abandonedshipvideoposter.png">
                       <source src="abandonedship.mp4" type="video/mp4">
                       <source src="abandonedship.ogg" type="video/ogg">
                   </video>
               </div>
               <div class="carousel-3d-item">
                   <video loop autoplay muted poster="waterfallvideoposter.png">
                       <source src="waterfallclip.mp4" type="video/mp4">
                       <source src="waterfallclip.ogg" type="video/ogg">
                   </video>
               </div>
               <div class="carousel-3d-item">
                   <video loop autoplay muted poster="pondsvideoposter.png">
                       <source src="ponds.mp4" type="video/mp4">
                       <source src="ponds.ogg" type="video/ogg">
                   </video>
               </div>
               <div class="carousel-3d-item">
                   <video loop autoplay muted poster="KeyArt-S3poster.png">
                       <source src="KeyArt-S3-Animation.mp4" type="video/mp4">
                       <source src="KeyArt-S3-Animation.ogg" type="video/ogg">
                   </video>
               </div>
               <div class="carousel-3d-item">
                   <video loop autoplay muted poster="S1_endcardposter.png">
                       <source src="S1_endcard.mp4" type="video/mp4">
                       <source src="S1_endcard.ogg" type="video/ogg">
                   </video>
               </div>
           </div>
           
           <!-- Navigation Buttons -->
           <button class="carousel-3d-btn carousel-3d-prev" aria-label="Previous">‹</button>
           <button class="carousel-3d-btn carousel-3d-next" aria-label="Next">›</button>
           
           <!-- Navigation Dots -->
           <div class="carousel-3d-dots">
               <span class="carousel-3d-dot active" data-index="0"></span>
               <span class="carousel-3d-dot" data-index="1"></span>
               <span class="carousel-3d-dot" data-index="2"></span>
               <span class="carousel-3d-dot" data-index="3"></span>
               <span class="carousel-3d-dot" data-index="4"></span>
           </div>
       </div>
       
       <!--Portfolio Secondary Button Navigation-->
       <nav class="portfoliotabs">
             <a href="portfolio.html" class="portfolionav">Key Art & Branding</a>
             <a href="capturedscenes.html" class="portfolionav">Captured Scenes</a>
             <a href="cinematicsandmotion.html" class="portfolionav active">Cinematics & Motion</a> <!-- Active class added to stay highlighted-->
             <a href="illustrations.html" class="portfolionav">Illustrations</a>
       </nav>
       
       <!--bottom left and right decorative elements, alt text left empty-->
       <div> 
             <img src="PeachShadesCloudsBottomLeft.png" class="bottomleftbackground" alt="">
             <img src="PeachShadesCloudsRightHorizontal.png"  class="bottomrightbackground" alt="">
       </div>
       
       <!--Footer, Copyright Line-->
       <footer id="copyright3">
          <p>Copyright &#169; 2025 Nashwa Hamido. All rights reserved.</p>
       </footer>
       
       <!-- Dark/Light Mode Toggle -->
       <div id="theme-toggle">
           <span class="theme-label dark-label">DARK</span>
           <label class="switch">
               <input type="checkbox" id="theme-checkbox">
               <span class="slider round"></span>
           </label>
           <span class="theme-label light-label">LIGHT</span>
       </div>
       
       <!-- 3D Carousel Script -->
       <script src="carousel-3d.js"></script>
       </body>
</html>
